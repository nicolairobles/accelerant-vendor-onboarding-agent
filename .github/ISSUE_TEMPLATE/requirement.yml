name: Requirement Work Item
description: Track implementation against a concrete requirement and verification path.
title: "[REQ]: "
labels: ["triage"]
body:
  - type: input
    id: requirement_ids
    attributes:
      label: Requirement ID(s)
      description: Reference one or more IDs from docs/requirements/requirements-register.md.
      placeholder: "REQ-004, REQ-009"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User or reviewer outcome
      description: What should be true when this is done?
      placeholder: "A reviewer can run case_003 and inspect the structured decision packet with evidence."
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Concrete pass/fail criteria. Include UI/output behavior where relevant.
      placeholder: |
        - DecisionPacket JSON validates.
        - Findings include evidence references.
        - No final approval language appears.
    validations:
      required: true
  - type: textarea
    id: implementation_scope
    attributes:
      label: Implementation scope
      description: Files/modules expected to change and files that should not be touched.
      placeholder: "Expected: vendor_agent/schemas.py, tests/test_schema.py. Do not touch: data/source-package."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Commands, evals, manual checks, or review needed.
      placeholder: |
        - pytest tests/test_schema.py
        - python -m vendor_agent.cli run --case ...
    validations:
      required: true
  - type: textarea
    id: guardrails
    attributes:
      label: Guardrails and risks
      description: Note security, privacy, policy, model-output, or scope risks.
      placeholder: "No model-generated approvals; no new dependencies; no secrets."
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Explicitly list tempting work that should not be included in this issue.
      placeholder: "No vector database; no deployment changes."
    validations:
      required: false

